services:
  db:
    image: postgres:16-alpine
    container_name: fixlink_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fixlink_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixlink} -d ${POSTGRES_DB:-fixlink_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      TZ: Asia/Ho_Chi_Minh

volumes:
  fixlink_data:
    driver: local
