services:
  db:
    image: postgres:16-alpine
    container_name: fixlink_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fixlink_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixlink} -d ${POSTGRES_DB:-fixlink_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      TZ: Asia/Ho_Chi_Minh

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixlink_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fixlink_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fixlink}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fixlink_secret_2024}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-fixlink-jwt-secret-key-2024-must-be-at-least-512-bits-long-for-hs512-algorithm-security}
      # Trợ lý FixLink: gọi qua cổng LiteLLM, LiteLLM không chạy thì gọi thẳng Groq
      CHATBOT_PROVIDER: ${CHATBOT_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-fixlink-local}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started

  # Cổng LiteLLM: chuyển Groq gpt-oss-120b → qwen3.8-27b → gpt-oss-20b khi hết hạn mức (cấu hình trong litellm/config.yaml)
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: fixlink_litellm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/fixlink-entrypoint.sh"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/entrypoint.sh:/app/fixlink-entrypoint.sh:ro
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Tùy chọn: key Groq của tài khoản thứ hai để gấp đôi hạn mức/ngày
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-fixlink-local}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixlink_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fixlink_data:
    driver: local
