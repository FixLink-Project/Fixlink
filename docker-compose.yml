services:
  db:
    image: postgres:16-alpine
    container_name: fixlink_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fixlink_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixlink} -d ${POSTGRES_DB:-fixlink_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      TZ: Asia/Ho_Chi_Minh

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixlink_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fixlink_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fixlink}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fixlink_secret_2024}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-fixlink-jwt-secret-key-2024-must-be-at-least-512-bits-long-for-hs512-algorithm-security}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixlink_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fixlink_data:
    driver: local
