name: FixLink Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Backend CI (Java 21 / Spring Boot / Maven)
  # ===========================================================================
  backend-ci:
    name: Backend Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate Code Formatting (Spotless)
        run: ./mvnw spotless:check -B

      - name: Run Code Quality Checks (Checkstyle)
        run: ./mvnw checkstyle:check -B

      - name: Execute Unit & Integration Tests
        run: ./mvnw test -B

      - name: Package Production JAR Artifact
        run: ./mvnw clean package -DskipTests -B

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: backend/target/fixlink-backend-*.jar
          retention-days: 7

  # ===========================================================================
  # 2. Frontend CI (Node.js 20 / Vite / Vitest)
  # ===========================================================================
  frontend-ci:
    name: Frontend Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Code Quality (Lint)
        run: npm run lint

      - name: Execute Frontend Unit Tests
        run: npm test

      - name: Build Static Production Distribution
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ===========================================================================
  # 3. Container Images Verification Build
  # ===========================================================================
  container-images-build:
    name: Verify Container Image Builds
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fixlink-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: fixlink-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
