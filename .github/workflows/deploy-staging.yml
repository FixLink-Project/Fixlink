name: FixLink CD - Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Bypass checks and force deployment to Staging'
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # 1. Build and Publish Release Images to Container Registry
  # ===========================================================================
  publish-container-images:
    name: Build & Push Staging Images
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "REPO_LC=$REPO_LC" >> $GITHUB_ENV
          echo "IMAGE_TAG_BACKEND=ghcr.io/$REPO_LC/backend:$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG_BACKEND_LATEST=ghcr.io/$REPO_LC/backend:staging-latest" >> $GITHUB_ENV
          echo "IMAGE_TAG_FRONTEND=ghcr.io/$REPO_LC/frontend:$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG_FRONTEND_LATEST=ghcr.io/$REPO_LC/frontend:staging-latest" >> $GITHUB_ENV

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_TAG_BACKEND }}
            ${{ env.IMAGE_TAG_BACKEND_LATEST }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_TAG_FRONTEND }}
            ${{ env.IMAGE_TAG_FRONTEND_LATEST }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ===========================================================================
  # 2. Deploy to Staging Host via Secure SSH
  #
  # Chi chay THU CONG (Actions > Run workflow). Push len main chi build &
  # push image, KHONG tu dong deploy — vi chua co server staging that va
  # chua khai 3 secret STAGING_SERVER_HOST / STAGING_SSH_USER /
  # STAGING_SSH_KEY. Khi da co server, chay tay workflow nay de deploy.
  # ===========================================================================
  deploy-to-staging:
    name: Deploy & Healthcheck on Staging
    if: github.event_name == 'workflow_dispatch'
    needs: publish-container-images
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Repository Configuration
        uses: actions/checkout@v4

      - name: Prepare Staging Server Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            mkdir -p /opt/fixlink-staging/docker

      - name: Copy Deployment Configs to Staging Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml,docker"
          target: "/opt/fixlink-staging"

      - name: Deploy Containers & Verify Health
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.publish-container-images.outputs.image_tag }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_TAG,STAGING_DB_PASSWORD,STAGING_JWT_SECRET,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            echo "🚀 [Deploy Staging] Deploying FixLink revision $IMAGE_TAG..."
            
            cd /opt/fixlink-staging
            
            REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_IMAGE_BACKEND="ghcr.io/$REPO_LC/backend"
            export DOCKER_IMAGE_FRONTEND="ghcr.io/$REPO_LC/frontend"
            export IMAGE_TAG="$IMAGE_TAG"
            export STAGING_DB_PASSWORD="$STAGING_DB_PASSWORD"
            export STAGING_JWT_SECRET="$STAGING_JWT_SECRET"

            # Create or update .env file securely
            cat <<EOF > .env
IMAGE_TAG=$IMAGE_TAG
STAGING_DB_PASSWORD=$STAGING_DB_PASSWORD
STAGING_JWT_SECRET=$STAGING_JWT_SECRET
JWT_SECRET=$STAGING_JWT_SECRET
APP_JWT_SECRET=$STAGING_JWT_SECRET
DOCKER_IMAGE_BACKEND=$DOCKER_IMAGE_BACKEND
DOCKER_IMAGE_FRONTEND=$DOCKER_IMAGE_FRONTEND
EOF
            chmod 600 .env

            # Authenticate to GHCR to pull images
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull newest release images
            docker compose -f docker-compose.staging.yml pull backend frontend
            
            # Zero-downtime rolling restart
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            
            # Logout from GHCR
            docker logout ghcr.io || true

            # Wait for backend health check
            echo "⏳ Verifying backend service health..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -f -s http://localhost:8080/api/v1/health > /dev/null; then
                echo "✅ Backend service is healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting for service to be ready ($i/12)..."
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Backend healthcheck failed after 60s!"
              docker compose -f docker-compose.staging.yml logs --tail=50 backend
              exit 1
            fi

            echo "🎉 Staging deployment completed successfully!"
