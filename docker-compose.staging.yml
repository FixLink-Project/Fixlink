services:
  db:
    image: postgres:16-alpine
    container_name: fixlink_staging_db
    restart: always
    environment:
      POSTGRES_USER: ${STAGING_DB_USER:-fixlink}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
      POSTGRES_DB: ${STAGING_DB_NAME:-fixlink_db}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - fixlink_staging_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_DB_USER:-fixlink} -d ${STAGING_DB_NAME:-fixlink_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fixlink_staging_net

  backend:
    image: ${DOCKER_IMAGE_BACKEND:-ghcr.io/fixlink/backend}:${IMAGE_TAG:-staging-latest}
    container_name: fixlink_staging_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${STAGING_DB_NAME:-fixlink_db}
      SPRING_DATASOURCE_USERNAME: ${STAGING_DB_USER:-fixlink}
      SPRING_DATASOURCE_PASSWORD: ${STAGING_DB_PASSWORD}
      APP_JWT_SECRET: ${STAGING_JWT_SECRET}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fixlink_staging_net

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-ghcr.io/fixlink/frontend}:${IMAGE_TAG:-staging-latest}
    container_name: fixlink_staging_frontend
    restart: always
    ports:
      - "${STAGING_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - fixlink_staging_net

networks:
  fixlink_staging_net:
    driver: bridge

volumes:
  fixlink_staging_data:
    driver: local
