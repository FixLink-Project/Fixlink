spring:
  datasource:
    url: jdbc:h2:mem:fixlink_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: fixlink-jwt-secret-key-2024-must-be-at-least-512-bits-long-for-hs512-algorithm-security
    expiration-ms: 86400000
