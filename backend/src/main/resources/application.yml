server:
  port: 8080
  servlet:
    context-path: /

fixlink:
  timezone: Asia/Ho_Chi_Minh

spring:
  application:
    name: fixlink-backend
  jackson:
    time-zone: Asia/Ho_Chi_Minh

  datasource:
    url: jdbc:postgresql://localhost:5432/fixlink_db
    username: eshop
    password: eshop
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # Cho phep migration co so thu tu thap hon chay sau (V5 duoc them vao
    # sau khi V6/V7 da chay tren cac DB hien co). Khong bat co nay thi
    # Flyway se fail khi gap migration "den muon".
    out-of-order: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Cấu hình JWT
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 giờ tính bằng milliseconds
  refresh-expiration: 604800000 # 7 ngày

# Cấu hình Swagger / SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Cấu hình Chatbot CSKH & Tư vấn thông minh FixLink
chatbot:
  enabled: ${CHATBOT_ENABLED:true}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    models:
      - gemini-3.8-flash
      - gemini-3.6-flash
      - gemini-3.5-flash-lite
      - gemini-3-flash-preview
      - gemini-3.1-flash-lite
    timeout-seconds: 20
    max-retries: 1
    cooldown-seconds: 60
    temperature: 0.3
    max-output-tokens: 2048
  tools:
    mode: ${CHATBOT_TOOLS_MODE:native} # native | mcp
    mcp:
      command: node
      args:
        - ../MCPSERVER/server.js
  rag:
    top-k: 6
    min-score: 0.35
    window: 1
  limits:
    max-input-chars: 1000
    max-tool-rounds: 4
    history-turns: 10
    guest-rate-per-10min: 20

