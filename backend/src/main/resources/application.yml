server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fixlink-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fixlink_db
    username: eshop
    password: eshop
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Cấu hình JWT
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 giờ tính bằng milliseconds
  refresh-expiration: 604800000 # 7 ngày

# Cấu hình Swagger / SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
