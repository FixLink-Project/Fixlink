server:
  port: 8080
  servlet:
    context-path: /

fixlink:
  timezone: Asia/Ho_Chi_Minh

spring:
  application:
    name: fixlink-backend
  jackson:
    time-zone: Asia/Ho_Chi_Minh

  datasource:
    url: jdbc:postgresql://localhost:5432/fixlink_db
    username: eshop
    password: eshop
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # Cho phep migration co so thu tu thap hon chay sau (V5 duoc them vao
    # sau khi V6/V7 da chay tren cac DB hien co). Khong bat co nay thi
    # Flyway se fail khi gap migration "den muon".
    out-of-order: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Cấu hình JWT
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 giờ tính bằng milliseconds
  refresh-expiration: 604800000 # 7 ngày

# Cấu hình Swagger / SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Cấu hình Chatbot CSKH & Tư vấn thông minh FixLink
chatbot:
  enabled: ${CHATBOT_ENABLED:true}
  # Nhà cung cấp LLM: groq (mặc định) | gemini
  provider: ${CHATBOT_PROVIDER:groq}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    # Chuỗi failover: model đầu tiên là model chính. Ghi đè bằng GROQ_MODELS (phân tách bằng dấu phẩy).
    models: ${GROQ_MODELS:openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b}
    timeout-seconds: 30
    total-budget-seconds: 60
    max-retries: 1
    cooldown-seconds: 60
    temperature: 0.4
    # Groq tính cả max-output-tokens vào hạn mức token/phút nên giữ ở mức vừa đủ
    max-output-tokens: 800
    reasoning-effort: low
    # Gói Groq miễn phí giới hạn vài nghìn token/phút nên chỉ nạp trích đoạn RAG liên quan vào prompt
    full-knowledge: ${GROQ_FULL_KNOWLEDGE:false}
    max-knowledge-chars: 1800
    max-tool-result-chars: 2000
    max-history-messages: 6
    max-history-message-chars: 600
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    # Chuỗi failover: gemini-3.6-flash là model chính, các model nhẹ làm dự phòng.
    # Có thể ghi đè bằng biến môi trường GEMINI_MODELS (phân tách bằng dấu phẩy).
    models: ${GEMINI_MODELS:gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
    timeout-seconds: 25
    total-budget-seconds: 90
    max-retries: 1
    cooldown-seconds: 60
    # Gemini 3 khuyến nghị temperature = 1.0 (hạ thấp dễ gây lặp/giảm chất lượng)
    temperature: 1.0
    # Gồm cả token suy luận (thinking) của Gemini 3
    max-output-tokens: 8192
    thinking-level: ${GEMINI_THINKING_LEVEL:low}
  tools:
    mode: ${CHATBOT_TOOLS_MODE:native} # native | mcp
    mcp:
      command: node
      args:
        - ../MCPSERVER/server.js
      server-path: ${CHATBOT_MCP_SERVER_PATH:../MCPSERVER/server.js}
  rag:
    top-k: 6
    min-score: 0.35
    window: 1
  limits:
    max-input-chars: 1000
    max-tool-rounds: 5
    history-turns: 10
    guest-rate-per-10min: 20

