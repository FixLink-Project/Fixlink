services:
  - type: web
    name: fixlink-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: fixlink-db
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fixlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://fixlink.vercel.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://fixlink.vercel.app
      - key: CHATBOT_ENABLED
        value: "false"

databases:
  - name: fixlink-db
    plan: free
    region: singapore
    databaseName: fixlink_db
    user: fixlink_user
